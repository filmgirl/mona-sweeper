name: Deploy game to GitHub Pages

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.ref || 'production' }}
  cancel-in-progress: false

jobs:
  compatibility:
    name: Cabinet compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      game-sha256: ${{ steps.digest.outputs.sha256 }}
    steps:
      - name: Check out candidate source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
      - name: Install dev tooling and browsers
        run: |
          npm ci
          npx playwright install --with-deps chromium webkit
      - name: Test gameplay engine
        run: npm test
      - name: Stage the site and test it inside the real cabinet
        run: |
          npm run cabinet:setup
          npm run build
          npm run test:cabinet
      - name: Record the tested artifact digest
        id: digest
        run: echo "sha256=$(sha256sum _site/index.html | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
      - name: Upload tested public site
        if: github.repository == 'filmgirl/mona-sweeper' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: _site
      - name: Upload browser failure evidence
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cabinet-failure
          path: test-results/
          if-no-files-found: ignore

  deploy:
    needs: compatibility
    if: github.repository == 'filmgirl/mona-sweeper' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages-deployment
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Deploy compatibility-tested artifact
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
      - name: Check the published page matches the tested artifact
        env:
          EXPECTED: ${{ needs.compatibility.outputs.game-sha256 }}
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          for delay in 0 10 20; do
            sleep "$delay"
            actual="$(curl -fsSL "${PAGE_URL}?smoke=${GITHUB_RUN_ID}" | sha256sum | cut -d ' ' -f 1 || true)"
            if [ "$actual" = "$EXPECTED" ]; then echo "Published page matches $EXPECTED"; exit 0; fi
            echo "Published digest ${actual:-unavailable} does not match yet."
          done
          exit 1
